# Быстрые проверки каждого PR: типы, загрузка спеков, запрещённые шаблоны (AGENTS.md §11).
# Браузер не запускается, стенд не трогается, секреты не нужны — около минуты.
# Это не ревью: ловит формальные нарушения, а не ошибки логики тестов.
name: PR checks

on:
  pull_request:
    branches: [master]

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # tests/config.ts требует учётные данные при загрузке. Тесты здесь не запускаются,
      # поэтому подставляются фиктивные значения — настоящие секреты PR-проверке не нужны.
      ANKOR_OWNER_EMAIL: ci@example.com
      ANKOR_OWNER_PASSWORD: ci
      ANKOR_SYSADMIN_EMAIL: ci@example.com
      ANKOR_SYSADMIN_PASSWORD: ci
      ANKOR_COACH_EMAIL: ci@example.com
      ANKOR_COACH_PASSWORD: ci
      ANKOR_PARENT_EMAIL: ci@example.com
      ANKOR_PARENT_PASSWORD: ci
      ANKOR_ATHLETE_EMAIL: ci@example.com
      ANKOR_ATHLETE_PASSWORD: ci
      ANKOR_EVAL_ATHLETE_EMAIL: ci@example.com
      ANKOR_EVAL_ATHLETE_PASSWORD: ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: All specs load
        # --reporter=list: без allure-playwright, иначе --list пишет «skipped» на каждый тест (AGENTS.md §11)
        run: npx playwright test --list --reporter=list > /dev/null

      - name: Forbidden patterns (locators in specs, waitForTimeout, .catch(() =>))
        # Тот же скрипт, что и локально: npm run lint (scripts/lint-tests.mjs)
        run: npm run lint
